title: Preguntas frecuentes
# [BORRADOR] Primera respuesta ajustada al registro abierto (2026-11-09).
items:
  - question: ¿Qué necesito para empezar?
    answer: Un computador, una tablet o un celular con internet y un navegador. No hay que instalar nada. Te registras con tu correo y empiezas con 14 días de prueba gratis. La impresora de tiquetes de 58 u 80 mm y el lector de código de barras son opcionales.
  - question: ¿Funciona en el celular?
    answer: Sí. La pantalla de ventas se adapta al celular, y el resto del sistema también se puede usar desde la tablet o el computador.
  - question: ¿Necesito internet todo el tiempo?
    answer: Sí. XASKA POS funciona en línea, así que necesitas conexión para registrar ventas.
  - question: ¿Qué pasa cuando termina la prueba gratis?
    answer: No te pedimos tarjeta. Al terminar los 14 días tu información queda guardada y la puedes consultar, pero para seguir vendiendo eliges un plan y lo pagas. Te avisamos por correo antes de que termine.
  - question: ¿Cómo es el soporte?
    answer: Nos escribes por WhatsApp o al correo soporte@xaska.co y te responde el equipo de XASKA, de lunes a sábado, de 8:00 a. m. a 6:00 p. m.
  - question: ¿Puedo manejar varias sucursales o varios negocios?
    answer: Sí. Una sola cuenta puede tener varios negocios. Con el plan Empresa cada negocio puede tener hasta 5 sedes, cada una con su propio inventario. Cada persona entra con su usuario y solo ve lo que su rol le permite.
  - question: ¿Mis datos están seguros?
    answer: La información de cada negocio se guarda por separado, la conexión va cifrada y hacemos copias de respaldo todos los días, y cada semana probamos que se puedan restaurar. Tus datos son tuyos.
  - id: factura-electronica
    question: ¿XASKA POS emite factura electrónica?
    answer: Todavía no. Hoy XASKA POS entrega un tiquete de venta, que no es factura electrónica ni documento equivalente electrónico ante la DIAN. Estamos trabajando para incluir la factura electrónica y lo anunciaremos en esta página cuando esté lista. Mientras tanto, si tu negocio debe facturar electrónicamente, necesitas hacerlo con otro sistema.
