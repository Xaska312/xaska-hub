seo:
  title: 'XASKA POS: punto de venta para tiendas y negocios'
  description: Sistema de punto de venta en la web para comercios, restaurantes y droguerías en Colombia. Ventas con código de barras, inventario por sucursal, tallas y colores, caja con arqueo. Prueba gratis de 14 días.
# Lema: el mismo de las tarjetas impresas. La última palabra sale resaltada.
slogan:
  - Vende.
  - Fía.
  - Cobra.
  - Controla.
lead: El punto de venta en la web para comercios en Colombia. Ventas, caja, fiados e inventario desde el computador, la tablet o el celular, sin instalar nada.

problems:
  title: Lo que resuelve
  items:
    - title: El cuaderno ya no da abasto
      text: Cada venta queda registrada con su producto, su precio y su forma de pago.
    - title: El inventario no cuadra
      text: Las existencias bajan solas con cada venta y sabes cuánto tienes en cada sucursal.
    - title: La caja no cuadra al cierre
      text: Abres y cierras caja con arqueo, y ves qué entró en efectivo y qué por otros medios.
    - title: No sabes qué se vende más
      text: Los reportes te muestran ventas por día, producto y forma de pago.

audience:
  title: Para quién es
  text: Para comercios de barrio y de centro comercial que quieren dejar el cuaderno o el programa viejo, para restaurantes que atienden a la mesa y para droguerías, con fórmulas, lotes y vencimientos. Funciona especialmente bien en tiendas de ropa y calzado, porque maneja tallas y colores, y también en minimercados, papelerías y otros negocios con mostrador.

# Pantallas de XASKA POS dibujadas en código (src/components/PosScreen.astro), con datos de
# ejemplo. Se ven nítidas en cualquier pantalla y no muestran datos de clientes reales.
screens:
  title: Así se ve
  lead: Las pantallas de XASKA POS, con los mismos colores y la misma forma de la app.
  note: Datos de ejemplo de un minimercado de prueba.
  items:
    - screen: inicio
      title: Inicio
      caption: Tus ventas del día, la utilidad y lo que más se vende.
      description: Inicio de XASKA POS con las ventas del día, el número de ventas, el ticket promedio, la utilidad, las ventas por hora y los productos más vendidos.
    - screen: tiquete
      title: Tiquete
      caption: Tiquete de 58 u 80 mm para imprimir, o como imagen para enviar por WhatsApp.
      description: Tiquete de venta con el negocio, los productos, el total, el pago en efectivo, el cambio y el botón Enviar con las opciones WhatsApp e Imagen del tiquete.
    - screen: cierre
      title: Cierre de caja
      caption: El cierre te dice cuánto efectivo debe haber, y lo comparas con lo que contaste.
      description: Cierre de caja con las ventas por medio de pago, la base de apertura, los egresos, el efectivo esperado, el efectivo contado y la diferencia en cero.
    - screen: fiado
      title: Fiado
      caption: Cada cliente con su cupo, lo que debe y sus abonos. El recordatorio sale por WhatsApp.
      description: Estado de cuenta de un cliente de fiado con su cupo, lo que debe, lo que le queda disponible, sus últimos movimientos y el botón para enviar el recordatorio por WhatsApp.
    - screen: sin-conexion
      title: Sin internet
      caption: Si se va el internet, sigues vendiendo. Las ventas se envían solas al volver la conexión.
      description: Pantalla de ventas con el aviso Sin conexión, sigues vendiendo, y la lista de ventas guardadas en el equipo con número provisional, pendientes de enviar.
    - screen: finanzas
      title: Finanzas
      caption: La plata que entra y sale en el mes, la ganancia y el punto de equilibrio.
      description: Tablero de Finanzas con las ventas netas, la utilidad bruta y la operativa del mes, la plata que entró por medio de pago, los gastos y el avance hacia el punto de equilibrio.
    - screen: mesas
      title: Mesas
      caption: Para restaurantes, las mesas por zona con su cuenta y un color para cada estado.
      description: Mapa de mesas de un restaurante por zona, cada mesa con su color según el estado (libre, en cocina, comiendo o pidió la cuenta) y el valor de su cuenta abierta.

capabilities:
  title: Qué puedes hacer
  groups:
    - title: Vender
      items:
        - Ventas con lector de código de barras
        - Pagos mixtos, por ejemplo parte en efectivo y parte con transferencia
        - Precio libre para lo que no tiene precio fijo
        - Pausar una venta y retomarla después
        - Tiquete imprimible de 58 u 80 mm
        - Impresión directa en la térmica y apertura del cajón monedero
        - Pantalla de ventas que funciona en el celular
        - Venta sin internet en el equipo de la caja; las ventas se envían al volver la conexión
    - title: Clientes
      items:
        - Fiado con cupo por cliente, abonos y estado de cuenta
        - Pedidos por encargo con anticipos y entregas parciales
        - Cotizaciones que se convierten en pedido o en venta
        - Clientes y proveedores
    - title: Inventario
      items:
        - Inventario por sucursal
        - Productos con tallas y colores
        - Carga de productos desde una hoja de cálculo
        - Etiquetas de báscula para productos por peso
        - Aviso de productos que no se venden
        - Compras con la factura del proveedor y cuentas por pagar
        - Traslados de inventario entre sedes
    - title: Caja
      items:
        - Apertura y cierre de caja con arqueo
        - Caja compartida entre varios vendedores
        - Cierre de caja para imprimir o enviar por WhatsApp
        - Recibo como imagen del tiquete para enviar por WhatsApp
    - title: Finanzas
      items:
        - Gastos con categorías, desde la caja o fuera de ella
        - Gastos fijos de cada mes o cada quincena, con aviso cuando toca pagarlos
        - Retenciones que te hacen los clientes al pagar
        - Estado de resultados en PDF o para Excel
        - Tablero con la plata que entra y sale, y el punto de equilibrio
    - title: Tu negocio y tu equipo
      items:
        - Varios negocios y varias sucursales en una sola cuenta
        - Usuarios con roles y permisos
        - Reportes de ventas y registro de cambios
        - Tu logo y tu color en el sistema y en el tiquete
        - Prendes o apagas los módulos que tu negocio no usa
    - title: Restaurantes
      items:
        - Mesas por zona y cuentas abiertas, que puedes mover o unir
        - Comandas a cocina y bar, impresas o en la pantalla de cocina
        - Adiciones y modificadores, como tamaños, extras y notas
        - Cobro de la cuenta por partes y propina voluntaria con su reparto
        - Impuesto al consumo (INC) en las categorías que lo llevan
        - Roles de mesero y cocina
        - Mapa de mesas y caja por zona
    - title: Droguerías
      items:
        - Ficha del medicamento con el catálogo CUM del INVIMA
        - Lotes y vencimientos, para vender primero lo que vence primero
        - Venta con fórmula médica, confirmada por quien tiene el permiso
        - Registro de temperatura y humedad del local y la nevera
        - Eventos adversos e informe para la visita de la Secretaría de Salud
        - Roles de director técnico y auxiliar de farmacia

# Factura electrónica: solo aparece con E_INVOICING en true (src/config/site.ts).
# Textos provisionales. Antes de poner la bandera en true, completarlos con los documentos que
# emite, el proveedor tecnológico, el costo (si lo tiene) y cómo se activa.
eInvoicing:
  group:
    title: Factura electrónica
    items:
      - Factura electrónica de venta desde la misma pantalla de cobro
  faqAnswer: Sí. Puedes emitir factura electrónica desde XASKA POS. Escríbenos por WhatsApp y te contamos cómo activarla para tu negocio.

plans:
  title: Planes
  lead: Tres planes, según el tamaño de tu negocio. Todos empiezan con 14 días de prueba gratis, sin tarjeta.
  items:
    - name: Emprende
      price: $34.900
      annual: $349.000 al año
      limits: 1 sede, 1 caja y 2 usuarios
      features:
        - Vender, caja, inventario y reportes
        - Fiado y clientes
    - name: Negocio
      price: $69.900
      annual: $699.000 al año
      limits: 1 sede, 3 cajas y 6 usuarios
      features:
        - Todo lo de Emprende
        - Pedidos, cotizaciones, tallas y colores, y báscula
        - Compras y cuentas por pagar
        - Impresión directa en la térmica y cajón monedero
        - El módulo de tu sector, restaurante o droguería
    - name: Empresa
      price: $129.900
      annual: $1.299.000 al año
      limits: Hasta 5 sedes, con cajas y usuarios sin límite
      features:
        - Todo lo de Negocio
        - Auditoría
        - Caja por zona
        - Traslados entre sedes
  comparison:
    title: Compara los planes
    rows:
      - label: Precio al mes
        values: [$34.900, $69.900, $129.900]
      - label: Precio al año (pagas 10 meses)
        values: [$349.000, $699.000, $1.299.000]
      - label: Sedes / cajas / usuarios
        values: [1 / 1 / 2, 1 / 3 / 6, 5 / sin límite / sin límite]
      - label: Vender, caja, inventario, fiado, clientes y reportes
        values: ['sí', 'sí', 'sí']
      - label: Pedidos, cotizaciones, tallas y colores, y báscula
        values: ['no', 'sí', 'sí']
      - label: Compras y cuentas por pagar, impresión directa y cajón
        values: ['no', 'sí', 'sí']
      - label: 'Módulo del sector: restaurante (mesas, cocina, adiciones y propinas) o droguería (fórmulas, lotes, temperatura e informe)'
        values: ['no', 'sí', 'sí']
      - label: Auditoría, caja por zona y traslados entre sedes
        values: ['no', 'no', 'sí']
  note: El plan anual vale 10 meses. Todos los planes incluyen soporte por WhatsApp y por correo (soporte@xaska.co).
  equipment:
    text: '¿Necesitas los equipos? Te armamos el punto de venta completo: computador, lector de código de barras, impresora térmica, cajón monedero y UPS, instalados y con garantía.'
    linkLabel: Ver equipos y computadores

start:
  title: Cómo empezar
  steps:
    - title: Regístrate gratis
      text: Crea tu cuenta con tu correo y elige probar gratis. Tienes 14 días, sin tarjeta. Si prefieres, también puedes pagar de una vez con Bre-B.
    - title: Configura tu negocio
      text: Carga tus productos uno a uno, desde una hoja de cálculo o con ASKA, tomándole foto al cuaderno o a la lista del proveedor.
    - title: Abre la caja y vende
      text: Si tienes dudas en el camino, escríbenos por WhatsApp.
