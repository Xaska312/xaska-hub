faq:
  - question: ¿Cómo cobro las fotocopias si no tienen código?
    answer: Con el precio libre escribes el valor en el momento, o creas "Fotocopia" como producto y solo cambias la cantidad.
  - question: Tengo cientos de productos, ¿los tengo que digitar uno por uno?
    answer: No. Los subes desde un archivo de Excel. También puedes crearlos a medida que los vendes.
  - question: ¿Me avisa cuando algo se está acabando?
    answer: Sí. Le pones un mínimo a cada producto y XASKA te muestra los que están por agotarse y los que llevan tiempo sin venderse.
  - question: ¿Funciona con mi lector de código de barras?
    answer: Sí. Los lectores USB comunes funcionan sin configurar nada. También puedes buscar por nombre o tocar el producto.
