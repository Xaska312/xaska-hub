# Sección para restaurantes y bares. Ilustración: src/components/scenes/RestaurantScene.astro.
order: 1
name: Restaurantes y bares
seo:
  title: Programa para restaurantes y bares con mesas y comandas
  description: XASKA POS para restaurantes y bares de Ibagué. Mesas por zona, comandas a cocina y barra, cuenta dividida con propina sugerida y caja cuadrada.
whatsapp: Hola, vengo de la página para restaurantes y bares y quiero ver XASKA POS
chip: Para restaurantes y bares
hero:
  title: Del primer pedido a la última cuenta, todo cuadra.
  lead: Toca las mesas del dibujo y cambian de estado, como en XASKA POS. Elige una y divide su cuenta con la propina sugerida.
  layout: side
  cta: Quiero verlo con mi carta
moments:
  title: Una noche en tu negocio
  items:
    - time: 7:00 p. m.
      title: Llega una mesa
      text: La ubicas en el plano y el mesero toma el pedido en la tablet, con adiciones y notas como "sin cebolla".
    - time: 7:05 p. m.
      title: La cocina y la barra lo ven
      text: Cada cosa sale a su estación, en pantalla o impresa. El mesero se entera cuando está lista.
    - time: 11:30 p. m.
      title: Cierras cuadrado
      text: Mesas, para llevar y domicilios en la misma caja, con las propinas repartidas entre quienes elijas.
pricing:
  plan: Negocio
  note: Mesas, comandas y cocina vienen desde el plan Negocio.
faq:
  - question: ¿Qué necesito para la pantalla de cocina o de la barra?
    answer: Cualquier tablet, computador o televisor con navegador. Se abre la pantalla de cocina de XASKA y los pedidos llegan solos. También se pueden imprimir las comandas.
  - question: ¿Puedo dividir la cuenta de una mesa?
    answer: Sí, por productos o en partes iguales, con la propina sugerida del 10 % que se le pregunta al cliente. El pago puede ser en efectivo, transferencia o las dos.
  - question: ¿Los meseros necesitan su propio usuario?
    answer: Sí. Cada mesero entra con su usuario y su rol de mesero, y la cocina con el suyo. Así sabes quién tomó cada pedido y cómo repartir las propinas.
  - question: ¿Sirve para comidas rápidas o un bar pequeño?
    answer: Sí. Si no atiendes a la mesa, vendes directo en la caja con adiciones en los productos, y también manejas pedidos para llevar y domicilios.
