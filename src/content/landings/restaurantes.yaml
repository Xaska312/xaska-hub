faq:
  - question: ¿Qué necesito para la pantalla de cocina?
    answer: Cualquier tablet, computador o televisor con navegador. Se abre la pantalla de cocina de XASKA y los pedidos llegan solos.
  - question: ¿Los meseros necesitan su propio usuario?
    answer: Sí. Cada mesero entra con su usuario y su rol de mesero, y la cocina con el suyo. Así sabes quién tomó cada pedido.
  - question: ¿Puedo cobrar una mesa con efectivo y transferencia?
    answer: Sí. El pago mixto te deja cobrar una parte en efectivo y otra por transferencia o tarjeta en la misma cuenta.
  - question: ¿Sirve para un negocio pequeño de comidas rápidas?
    answer: Sí. Si no atiendes a la mesa, vendes directo en la caja como cualquier comercio, con adiciones en los productos.
