# Sección para tiendas, minimarkets y papelerías. Ilustración: src/components/scenes/StoreScene.astro.
order: 2
name: Tiendas, minimarkets y papelerías
seo:
  title: Programa para tiendas, minimarkets y papelerías
  description: XASKA POS para tiendas, minimarkets y papelerías de Ibagué. Vende con lector, fía con cupo, cobra fotocopias con precio libre y sigue vendiendo sin internet.
whatsapp: Hola, vengo de la página para tiendas y quiero ver XASKA POS
chip: Para tiendas, minimarkets y papelerías
hero:
  title: Vende rápido aunque haya fila.
  lead: Toca los productos de la estantería y pasan a la caja, como con el lector. Si el cliente es de confianza, se lo fías dentro de su cupo.
  layout: side
  cta: Quiero verlo con mis productos
moments:
  title: Un día en tu negocio
  items:
    - time: 7:00 a. m.
      title: Abres la caja
      text: Con la base del día. Si se va el internet a media mañana, sigues vendiendo y todo se envía al volver.
    - time: 12:00 m.
      title: La hora de la fila
      text: Lector, báscula para el queso y precio libre para las fotocopias. Efectivo y transferencia en la misma venta.
    - time: 8:00 p. m.
      title: Sabes qué pedir
      text: Cierras cuadrado y ves lo que se está acabando y lo que lleva semanas quieto.
pricing:
  plan: Emprende
  note: El fiado viene en todos los planes. Las cotizaciones y la báscula, desde el plan Negocio.
faq:
  - question: ¿Cómo cobro las fotocopias si no tienen código?
    answer: Con el precio libre escribes el valor en el momento, o creas "Fotocopia" como producto y solo cambias la cantidad.
  - question: Tengo cientos de productos, ¿los tengo que digitar uno por uno?
    answer: No. Los subes desde un archivo de Excel. También puedes crearlos a medida que los vendes.
  - question: ¿Puedo fiarle a mis clientes de confianza?
    answer: Sí. Cada cliente tiene su cupo, sus abonos y su estado de cuenta, y le puedes mandar el recordatorio por WhatsApp.
  - question: ¿Qué pasa si se va el internet?
    answer: Sigues vendiendo en el equipo de la caja con los productos y precios que quedaron guardados, y las ventas se envían solas cuando vuelve la conexión.
