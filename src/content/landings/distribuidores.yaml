# Landing para distribuidores que surten y fían a tiendas (segmento 1 de la estrategia comercial).
# Pensada para anuncios y visitas: un solo botón (WhatsApp, con mensaje propio para saber de dónde llegó).
order: 1
name: Distribuidores
seo:
  title: Programa para distribuidores que fían a tiendas
  description: XASKA POS para distribuidores de Ibagué. Fía a cada tienda con cupo, lleva los pedidos y cobra con recibo por WhatsApp, desde el celular en la ruta.
whatsapp: Hola, vengo de la página para distribuidores y quiero ver XASKA POS
chip: Para distribuidores
hero:
  title: Sabe cuánto te debe cada tienda, sin buscar el cuaderno.
  lead: Con XASKA POS fías a cada tienda con su cupo, anotas los abonos y cobras con el recibo por WhatsApp. Desde el celular, en la ruta, aunque no haya señal.
  screen: fiado
  screenTitle: Fiado
  screenDescription: Estado de cuenta de una tienda con su cupo, lo que debe, lo disponible, sus movimientos y el botón para mandarle el recordatorio por WhatsApp. Datos de ejemplo.
pains:
  title: Lo que te resuelve en el día a día
  items:
    - icon: users
      title: El fiado, tienda por tienda
      text: Cada tienda con su cupo, lo que debe, sus abonos y desde cuándo. Ves la cartera ordenada por antigüedad y sabes a quién cobrarle primero.
    - icon: chat
      title: El cobro, por WhatsApp
      text: Mandas el recordatorio y el recibo por WhatsApp. Sin papeles que se pierden y con todo anotado.
    - icon: box
      title: Los pedidos, en orden
      text: Anotas lo que pide cada tienda, con o sin anticipo, y entregas por partes si hace falta. El pedido sale en PDF para mandarlo.
    - icon: register
      title: La venta, en la ruta
      text: Vendes desde el celular en el camión o en la tienda. Si se cae la señal, sigues vendiendo y se envía cuando vuelve.
screens:
  title: Así se ve
  items:
    - screen: tiquete
      title: Tiquete
      caption: El recibo impreso o como imagen por WhatsApp.
      description: Tiquete de venta con los productos, el total, el pago y el botón Enviar con la opción de imagen del tiquete. Datos de ejemplo.
    - screen: sin-conexion
      title: Sin señal
      caption: Sin internet sigues vendiendo; las ventas se envían al volver.
