# Sección para distribuidores que surten y fían a tiendas. Ilustración: src/components/scenes/RouteScene.astro.
order: 5
name: Distribuidores
seo:
  title: Programa para distribuidores que fían a tiendas
  description: XASKA POS para distribuidores de Ibagué. Fía a cada tienda con cupo, lleva los pedidos y cobra con recibo por WhatsApp, desde el celular en la ruta.
whatsapp: Hola, vengo de la página para distribuidores y quiero ver XASKA POS
chip: Para distribuidores
hero:
  title: Sabe cuánto te debe cada tienda de tu ruta.
  lead: Toca una tienda de la ruta y ves lo que debe, su cupo y su pedido. Recibe un abono y mira cómo baja la cuenta, desde el celular y aunque no haya señal.
  layout: wide
  cta: Quiero verlo en mi ruta
moments:
  title: Un día de ruta
  items:
    - time: 6:00 a. m.
      title: Cargas el camión
      text: Con los pedidos de cada tienda, con o sin anticipo, y la lista de precios para tiendas.
    - time: 10:00 a. m.
      title: Fías y cobras
      text: Cada tienda dentro de su cupo. Los abonos quedan anotados y el recibo sale por WhatsApp.
    - time: 4:00 p. m.
      title: Sabes quién debe
      text: La cartera ordenada por antigüedad, para saber a quién cobrarle primero mañana.
pricing:
  plan: Negocio
  note: El fiado viene en todos los planes. Los pedidos, desde el plan Negocio.
faq:
  - question: ¿Puedo ponerle un cupo distinto a cada tienda?
    answer: Sí. Cada cliente tiene su cupo y XASKA no deja fiar por encima de él; solo el dueño o el administrador pueden autorizarlo, y queda registrado.
  - question: ¿Sirve si vendo desde el celular en la ruta?
    answer: Sí. XASKA POS funciona en el celular sin instalar nada. Si se va la señal con la caja abierta, sigues vendiendo en ese equipo y las ventas se envían solas cuando vuelve la conexión. Para fiar sí necesitas conexión en ese momento.
  - question: ¿Cómo le cobro a una tienda que me debe?
    answer: Desde su estado de cuenta le mandas el recordatorio por WhatsApp. Cuando abona, lo registras y le llega el recibo.
  - question: ¿Puedo tener precios distintos para cada tipo de cliente?
    answer: Sí. Con las listas de precios manejas, por ejemplo, un precio para tiendas y otro para el público.
