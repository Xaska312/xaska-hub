pricing:
  plan: Negocio
  note: El fiado viene en todos los planes. Los pedidos, desde el plan Negocio.
faq:
  - question: ¿Puedo ponerle un cupo distinto a cada tienda?
    answer: Sí. Cada cliente tiene su cupo y XASKA no deja fiar por encima de él; solo el dueño o el administrador pueden autorizarlo, y queda registrado. Ves lo que debe, lo que le queda y todos sus abonos.
  - question: ¿Sirve si vendo desde el celular en la ruta?
    answer: Sí. XASKA POS funciona en el celular sin instalar nada. Si se va la señal con la caja abierta, sigues vendiendo en ese equipo y las ventas se envían solas cuando vuelve la conexión. Para fiar sí necesitas conexión en ese momento.
  - question: ¿Cómo le cobro a una tienda que me debe?
    answer: Desde su estado de cuenta le mandas el recordatorio por WhatsApp. Cuando abona, lo registras y le llega el recibo.
  - question: ¿Puedo tener precios distintos para cada tipo de cliente?
    answer: Sí. Con las listas de precios manejas, por ejemplo, un precio para tiendas y otro para el público.
