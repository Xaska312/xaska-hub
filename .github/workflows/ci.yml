name: CI

on:
  pull_request:
  push:
    branches: [main, desarrollo]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: astro check (TypeScript)
        run: pnpm check

      # Revisión estricta, como la hará Cloudflare en main: sin pendientes ni borradores y con
      # las claves públicas de Turnstile y Web Analytics (no son secretas: van en el HTML).
      - name: Build de producción (revisión estricta)
        run: pnpm build
        env:
          XASKA_ENV: production
          PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAFubYiEgTgIqzsfG
          PUBLIC_CF_ANALYTICS_TOKEN: a67671177baf4c8cb39c818b75f6acb9

      # Las pruebas corren sobre la versión de prueba (con la franja, la clave de prueba de
      # Turnstile y sin analítica), también en main.
      - name: Build para las pruebas
        run: pnpm build
        env:
          XASKA_ENV: preview

      - name: Instalar navegador de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas (humo, SEO y accesibilidad con axe)
        run: pnpm test

      - name: Lighthouse (móvil, meta ≥ 95)
        run: pnpm lighthouse

      - name: Guardar reportes si algo falla
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            lighthouse-report/
          retention-days: 7
