name: CI

on:
  pull_request:
  push:
    branches: [main, desarrollo]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: astro check (TypeScript)
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Instalar navegador de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas (humo, SEO y accesibilidad con axe)
        run: pnpm test

      - name: Lighthouse (móvil, meta ≥ 95)
        run: pnpm lighthouse

      - name: Guardar reportes si algo falla
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            lighthouse-report/
          retention-days: 7
